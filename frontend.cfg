# frontend.cfg - Emulator Frontend Configuration
# ---------------------------------------------------
# Each entry requires three fields inside an [Entry] block:
#   name       = Display name shown in the menu
#   launch     = Full command line (executable + arguments)
#   screenshot = Path to a PNG screenshot image
#
# Lines beginning with # or ; are comments.
# Blank lines are ignored.
# Maximum of 16 entries.
# ---------------------------------------------------

[Entry]
name       = Pac-Man (MAME)
launch     = D:\emu\MAME\mame.exe pacman -nowindow
screenshot = D:\new\Logo1.png

[Entry]
name       = Donkey Kong (MAME)
launch     = D:\emu\MAME\mame.exe dkong -nowindow
screenshot = D:\new\Logo2.png

[Entry]
name       = Space Invaders (MAME)
launch     = D:\emu\MAME\mame.exe invaders -nowindow
screenshot = D:\new\Logo3.png

[Entry]
name       = Sonic the Hedgehog (Gens)
launch     = D:\emu\GENESIS\Gens\gens.exe "D:\emu\GENESIS\ROMS\Sonic 1 Megamix v3.0.bin" /fullscreen
screenshot = D:\Pictures\Clean\Rodents\Sonic the Hedgehog\ct26.jpg

[Entry]
name       = Super Mario Bros (FCEUX)
launch     = D:\emu\NES\fceux.exe --fullscreen D:\emu\NES\SMB1.NES
screenshot = D:\new\Logo5.png
