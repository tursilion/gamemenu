# frontend.cfg - Emulator Frontend Configuration
# ---------------------------------------------------
# Each entry requires three fields inside an [Entry] block:
#   name       = Display name shown in the menu
#   launch     = Full command line (executable + arguments)
#   screenshot = Path to a PNG screenshot image
#
# Lines beginning with # or ; are comments.
# Blank lines are ignored.
# Maximum of 16 entries.
# ---------------------------------------------------

[Entry]
name       = Pac-Man (MAME)
launch     = C:\MAME\mame64.exe pacman -nowindow
screenshot = C:\Frontend\screens\pacman.png

[Entry]
name       = Donkey Kong (MAME)
launch     = C:\MAME\mame64.exe dkong -nowindow
screenshot = C:\Frontend\screens\dkong.png

[Entry]
name       = Space Invaders (MAME)
launch     = C:\MAME\mame64.exe invaders -nowindow
screenshot = C:\Frontend\screens\invaders.png

[Entry]
name       = Sonic the Hedgehog (Gens)
launch     = C:\Emulators\Gens\gens.exe "C:\ROMs\Mega Drive\Sonic.md" /fullscreen
screenshot = C:\Frontend\screens\sonic.png

[Entry]
name       = Super Mario Bros (FCEUX)
launch     = C:\Emulators\FCEUX\fceux.exe "C:\ROMs\NES\smb.nes" --fullscreen 1
screenshot = C:\Frontend\screens\smb.png
